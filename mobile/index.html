<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
     <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />  
    <link rel="stylesheet" href="style.css">
    <title>Monrock Collection</title>

</head>

<body>
    <div id="welcomeScreen" class="welcome-screen">

  <div class="welcome-content" >

    <img src="gallery.jpg" id="enterBtn"  alt="Gallery Entrance">

  </div>

</div>

  <div class="container">

    <!-- Header -->
    <div class="header">
      Monrock Collection
    </div>

    <!-- Main Viewer -->
    <div class="viewer">
  <div id="viewerContent" class="art-frame">
    
  </div>
</div>

    <!-- Thumbnails -->
    <div class="thumbnails" id="thumbnails">
      <div class="thumbnail"></div>
      
    </div>

    <!-- Categories -->
    <div class="categories">

  <input type="radio" name="category" id="rock" value="rock" checked>
  <label for="rock">Rock</label>

  <input type="radio" name="category" id="hollywood" value="hollywood">
  <label for="hollywood">Hollywood</label>

  <input type="radio" name="category" id="sports" value="sports">
  <label for="sports">Sport</label>
        
</div>
      <div class="categories">

  <input type="radio" name="category" id="masterpiece" value="masterpiece">
  <label for="masterpiece">Masterpiece</label>

  <input type="radio" name="category" id="wildlife" value="wildlife">
  <label for="wildlife">Nature</label>
        <input type="radio" name="category" id="custom" value="custom">
  <label for="custom">Commission</label>
</div>

    <!-- Bottom Buttons -->
    <div class="bottom-buttons">
        <button id="musicBtn">🔊</button>
  <button id="aboutBtn">About</button>
        
</div>

  </div>
    <audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
<script src="script.js"></script>
    <script>
loadCategory(document.querySelector('input[name="category"]:checked').value);
</script>
    
    <script>
    document.addEventListener("contextmenu", (e) => {
  e.preventDefault();
});
    </script>
    
</body>
</html>
